name: open_refresh_proposal

# Opens a refresh-proposal PR as github-actions[bot] so the repo owner can
# approve it (GitHub forbids approving your own PR, and the local refresh
# automation authenticates as the owner). Dispatched by the local automation
# after it pushes the proposal branches.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Proposal head branch (e.g. refresh/2026-07-17/next)"
        required: true
      title:
        description: "PR title (e.g. Refresh next from upstream 2026-07-17)"
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  open_pr:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout proposal branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Open proposal PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f .github/refresh-report.md ]; then
            echo "Proposal branch is missing .github/refresh-report.md" >&2
            exit 1
          fi
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base next \
            --head "${{ inputs.branch }}" \
            --title "${{ inputs.title }}" \
            --label refresh-proposal \
            --body-file .github/refresh-report.md
